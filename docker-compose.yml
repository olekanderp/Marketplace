services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: n5deal
      POSTGRES_PASSWORD: n5deal
      POSTGRES_DB: n5deal
    ports:
      - "5433:5432" # host 5433 to avoid clashing with a local Postgres on 5432
    volumes:
      - n5deal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n5deal -d n5deal"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://n5deal:n5deal@db:5432/n5deal
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgres://n5deal:n5deal@db:5432/n5deal
      # Override for any real deployment: `JWT_SECRET=$(openssl rand -base64 48) docker compose up`
      JWT_SECRET: ${JWT_SECRET:-n5deal-compose-prototype-secret-not-for-real-deployments-01}
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
      COOKIE_SECURE: "false" # compose serves plain HTTP on localhost
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  n5deal-pgdata:
